---
# Example inventory for the "dev" environment.
#
# ansible_host below is a PLACEHOLDER, not a real server - this repo is a
# public portfolio project and must never contain a real IP/hostname. See
# inventory/README.md for how to point this at your own server.
dev_servers:
  hosts:
    dev-server-1:
      ansible_host: "REPLACE_WITH_YOUR_SERVER_IP_OR_HOSTNAME"
      ansible_user: ubuntu
  vars:
    ansible_python_interpreter: /usr/bin/python3
