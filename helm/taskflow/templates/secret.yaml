{{- /*
Only rendered when the caller hasn't supplied their own pre-created
Secret via postgres.auth.existingSecret. This is the chart's dev/lab
default: a plaintext Secret built from postgres.auth.password, which
defaults to an obviously-fake placeholder (see values.yaml) - never a
real credential. See helm/taskflow/README.md's "Secrets" section for the
existingSecret alternative recommended for anything beyond a local/lab
deployment.
*/ -}}
{{- if not .Values.postgres.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "postgres") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
---
{{- /*
Only rendered when the caller hasn't supplied their own pre-created
Secret via taskService.database.existingSecret. Deliberately generated
as its own Secret (not reusing the postgres one above) so a real
deployment can point task-service at an externally-managed database
(e.g. Amazon RDS) via existingSecret without that database needing to be
the in-chart Postgres StatefulSet at all.
*/ -}}
{{- if not .Values.taskService.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "task-service") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "task-service") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg2://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ include "taskflow.componentFullname" (dict "root" . "component" "postgres") }}:{{ .Values.postgres.service.port }}/{{ .Values.postgres.auth.database }}"
{{- end }}
