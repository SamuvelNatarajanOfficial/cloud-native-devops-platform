# Default values for the taskflow chart.
#
# These are portfolio/lab defaults, not production-tuned numbers - see
# values-dev.yaml / values-prod.yaml for environment-specific overrides,
# and helm/taskflow/README.md for what every value below means.

global:
  # Namespace every chart resource is created in.
  namespace: taskflow

  # The chart does NOT create this namespace itself by default. Reason:
  # if a Namespace object were part of what ArgoCD/Helm manages and later
  # pruned, that would delete everything in the namespace - a much bigger
  # blast radius than intended. Use `helm install --create-namespace`, or
  # (for ArgoCD) the Application's `CreateNamespace=true` syncOption,
  # which creates the namespace once without making it a pruned/managed
  # resource. See helm/taskflow/README.md and argocd/README.md.
  createNamespace: false

  # Only needed for a private image registry - unused for the public
  # images this chart references by default.
  imagePullSecrets: []

  # Phase 6: least-privilege NetworkPolicies for api-gateway/task-service/
  # postgres (see templates/networkpolicy.yaml). Disabled by default -
  # NetworkPolicy objects have NO EFFECT AT ALL unless the cluster's CNI
  # actually enforces them (the default Amazon VPC CNI does not, unless
  # its NetworkPolicy support is explicitly enabled, or an alternative
  # like Calico is installed) - see
  # docs/networking-architecture.md#network-policies. Enabling this on a
  # non-enforcing CNI is silently a no-op, not a security improvement;
  # verify enforcement before relying on it.
  networkPolicy:
    enabled: false
    # Namespace Prometheus runs in (see observability/README.md) - allowed
    # ingress to api-gateway's/task-service's /metrics port. Matched via
    # the kubernetes.io/metadata.name label every namespace gets
    # automatically since Kubernetes 1.21.
    monitoringNamespace: monitoring

apiGateway:
  replicaCount: 2

  image:
    repository: taskflow/api-gateway
    # Empty -> falls back to .Chart.AppVersion (see templates/_helpers.tpl).
    # Deliberately never defaults to "latest" - see
    # docs/technology-decisions.md ("Why avoid latest image tags?").
    tag: ""
    pullPolicy: IfNotPresent

  # Deliberately ClusterIP (not LoadBalancer): api-gateway is reached
  # through the Ingress below, which provisions ONE shared ALB for the
  # whole application - a LoadBalancer-type Service here would instead
  # provision its own SEPARATE ELB per Service, one more load balancer to
  # pay for and secure per Service instead of one Ingress in front of
  # everything. See docs/networking-architecture.md#kubernetes-service-exposure.
  service:
    type: ClusterIP
    port: 8080

  # Phase 6: external HTTPS entry point via the AWS Load Balancer
  # Controller (see networking/aws-load-balancer-controller/ and
  # docs/networking-architecture.md). Disabled by default - turning this
  # on requires a real ACM certificate (certificateArn) and a domain
  # you actually control (host), neither of which this portfolio project
  # has. See values-prod.yaml for a filled-in example and
  # helm/taskflow/README.md#ingress for the exact steps.
  ingress:
    enabled: false
    className: alb
    host: "api.taskflow.example.com"
    # ARN of an ACM certificate already validated for `host` above (e.g.
    # the dns Terraform module's certificate_arn output) - see
    # docs/networking-architecture.md#tls--acm. Left empty on purpose;
    # never a real ARN in this repo.
    certificateArn: ""
    # /health (Phase 1's liveness endpoint) - see
    # docs/networking-architecture.md#ingress for why the ALB's own
    # health check reuses this instead of a separate check.
    healthCheckPath: /health
    # Merged into the Ingress's own annotations, on top of the
    # alb.ingress.kubernetes.io/* set templates/ingress.yaml already
    # hardcodes (scheme, target-type, listen-ports, ssl-redirect,
    # certificate-arn, healthcheck-*) - use this for anything
    # environment-specific, e.g. alb.ingress.kubernetes.io/group.name to
    # share one ALB across multiple Ingress objects.
    annotations: {}

  # Portfolio/lab defaults, not load-tested numbers - see
  # helm/taskflow/README.md.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 128Mi

  # Reuses the /health and /ready endpoints already implemented in Phase 1
  # (services/api-gateway/src/app.js) - no new endpoints invented here.
  # /health = liveness (process is up); /ready = readiness (can reach
  # task-service).
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 15
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  # See helm/taskflow/README.md's "Security context" section - this
  # profile matches how the image is actually built (a non-root "app"
  # user, no runtime writes outside /tmp).
  securityContext:
    pod:
      runAsNonRoot: true
      # Explicit numeric UID/GID, matching the "app" user each Dockerfile
      # creates (services/api-gateway/Dockerfile,
      # services/task-service/Dockerfile) - required for runAsNonRoot to
      # actually work. Without an explicit runAsUser, Kubernetes cannot
      # verify a container image's *named* user is non-root without
      # starting it first, so it refuses to start the container at all
      # ("container has runAsNonRoot and image has non-numeric user...
      # cannot verify user is non-root") - a real failure this project
      # only discovered via actual runtime deployment (Phase 7), not
      # static validation. See docs/local-runtime-validation.md.
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

taskService:
  replicaCount: 2

  image:
    repository: taskflow/task-service
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8000

  env:
    logLevel: info

  database:
    # Name of a pre-created Secret containing a DATABASE_URL key, used
    # instead of the chart-generated connection string (see
    # postgres.auth below) when set. Recommended for anything beyond a
    # local/lab deployment - see helm/taskflow/README.md's "Secrets"
    # section. Left empty by default so the chart works out of the box
    # against its own bundled dev Postgres.
    existingSecret: ""
    existingSecretKey: DATABASE_URL

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Reuses the /health and /ready endpoints already implemented in Phase 1
  # (services/task-service/app/main.py). /health = liveness (process is
  # up); /ready = readiness (database connection actually usable).
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 2
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  securityContext:
    pod:
      runAsNonRoot: true
      # Explicit numeric UID/GID, matching the "app" user each Dockerfile
      # creates (services/api-gateway/Dockerfile,
      # services/task-service/Dockerfile) - required for runAsNonRoot to
      # actually work. Without an explicit runAsUser, Kubernetes cannot
      # verify a container image's *named* user is non-root without
      # starting it first, so it refuses to start the container at all
      # ("container has runAsNonRoot and image has non-numeric user...
      # cannot verify user is non-root") - a real failure this project
      # only discovered via actual runtime deployment (Phase 7), not
      # static validation. See docs/local-runtime-validation.md.
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  # This is a demo/lab Postgres for the portfolio environment, NOT a
  # substitute for a managed database service - see
  # helm/taskflow/README.md's "PostgreSQL" section for what that means in
  # practice (no replication, no automated backups, no failover).
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  auth:
    database: taskflow
    username: taskflow
    # DEV-ONLY placeholder, intentionally not a real secret - matches the
    # same placeholder convention docker-compose.yml and
    # kubernetes/postgres/secret.example.yaml already use. Never set a
    # real password here; use existingSecret instead. See
    # helm/taskflow/README.md's "Secrets" section.
    password: "changeme-dev-only"
    existingSecret: ""
    existingSecretUserKey: POSTGRES_USER
    existingSecretPasswordKey: POSTGRES_PASSWORD

  persistence:
    enabled: true
    size: 1Gi
    # "" = the cluster's default StorageClass (e.g. EKS's gp2/gp3 default).
    storageClassName: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Intentionally a smaller subset than apiGateway/taskService's security
  # context - see helm/taskflow/README.md's "Security context" section
  # for exactly why (the stock postgres image's entrypoint needs to start
  # as root to prepare the data directory on first run, before dropping
  # privileges internally via gosu). Phase 4 flagged this as "not verified
  # against a live cluster"; Phase 7's actual runtime deployment verified
  # it and found `capabilities.drop: ["ALL"]` genuinely breaks postgres
  # startup - CrashLoopBackOff with "chmod: /var/run/postgresql:
  # Operation not permitted" / "chown: /var/lib/postgresql/data: Operation
  # not permitted", because dropping ALL capabilities removes root's
  # normal CAP_CHOWN/CAP_FOWNER/CAP_DAC_OVERRIDE - the exact capabilities
  # its entrypoint needs to prepare the mounted volume before it drops to
  # the postgres user. No capabilities are dropped here as a result - this
  # container needs root's full default capability set for its bootstrap
  # step, not a narrowed one. See docs/local-runtime-validation.md.
  securityContext:
    pod: {}
    container:
      allowPrivilegeEscalation: false

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
