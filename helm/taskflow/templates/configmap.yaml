apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "api-gateway") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "api-gateway") | nindent 4 }}
data:
  API_GATEWAY_PORT: {{ .Values.apiGateway.service.port | quote }}
  # Computed from the same fullname helper task-service's own Service
  # uses below, so this can never drift out of sync with the actual
  # Service name.
  TASK_SERVICE_URL: "http://{{ include "taskflow.componentFullname" (dict "root" . "component" "task-service") }}:{{ .Values.taskService.service.port }}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "task-service") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "task-service") | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.taskService.env.logLevel | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "postgres") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
data:
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
