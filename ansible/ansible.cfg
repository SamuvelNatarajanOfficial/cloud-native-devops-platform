# --------------------------------------------------------------------------
# Ansible configuration for this repository.
#
# Run ansible-playbook/ansible-lint/etc. from inside this ansible/ directory
# (or with ANSIBLE_CONFIG=ansible/ansible.cfg) so this file is picked up.
# --------------------------------------------------------------------------
[defaults]
# Default inventory is the "dev" environment. Point at a different
# environment explicitly with -i, e.g.:
#   ansible-playbook -i inventory/staging/hosts.yml playbooks/site.yml
inventory = inventory/dev/hosts.yml
roles_path = roles

# Host key checking stays ON (the default). This is a deliberate choice,
# not an oversight: disabling it repo-wide would silently accept any
# host's SSH key, which is exactly the kind of security feature this
# project shouldn't switch off just for convenience. For a brand-new
# throwaway lab VM, either connect once manually with `ssh` to accept its
# key normally, or opt in per-run with:
#   ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook ...
# rather than baking that override into this file.
host_key_checking = True

# Never write a <playbook>.retry file on failure - these are local,
# environment-specific, and easy to accidentally commit.
retry_files_enabled = False

# Easier-to-read task output than plain JSON-in-a-line, especially useful
# when reviewing --diff/--check output before applying anything for real.
# (The old standalone "yaml" callback was removed upstream; this is its
# current equivalent - see ansible.builtin.default's result_format option.)
stdout_callback = default
result_format = yaml

# Suppresses the ansible-lint/ansible-playbook "cowsay" easter egg so CI
# logs stay plain text.
nocows = 1

interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

[ssh_connection]
# Reduces the number of SSH operations Ansible needs per task, which
# noticeably speeds up multi-task runs. Requires the remote user's sudo
# config to not set `requiretty` - true by default on stock Ubuntu
# cloud images (the target OS for the inventory in this repo).
pipelining = True
