apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: taskflow
  labels:
    app.kubernetes.io/name: task-service
    app.kubernetes.io/part-of: taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: task-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-service
        app.kubernetes.io/part-of: taskflow
    spec:
      containers:
        - name: task-service
          image: taskflow/task-service:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: task-service-config
            - secretRef:
                name: task-service-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
