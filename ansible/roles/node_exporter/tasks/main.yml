---
- name: Create node_exporter system group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create node_exporter system user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    comment: "Prometheus Node Exporter (managed by Ansible)"

- name: Download Node Exporter release archive
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/{{ node_exporter_archive_name }}.tar.gz"
    checksum: "{{ node_exporter_checksum | default(omit, true) }}"
    mode: "0644"
  register: node_exporter_archive

- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: "{{ node_exporter_archive.dest }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ node_exporter_archive_name }}/node_exporter"

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_archive_name }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart node_exporter

- name: Remove downloaded archive and extracted directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ node_exporter_archive.dest }}"
    - "/tmp/{{ node_exporter_archive_name }}"

- name: Deploy Node Exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart node_exporter

- name: Ensure Node Exporter service is enabled and running
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
