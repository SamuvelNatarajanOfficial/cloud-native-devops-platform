# AWS Load Balancer Controller values for the "dev"/lab environment.
#
# Chart: eks/aws-load-balancer-controller (https://aws.github.io/eks-charts)
# Pinned version: 3.5.0 (app version v3.5.0) - verified current via the
# controller's own GitHub Releases API at the time this file was written.
# Re-verify (`helm search repo eks/aws-load-balancer-controller --versions`)
# before actually installing - same "pin deliberately, never track latest"
# principle as observability/README.md#versions.
#
# Deploy (see argocd/application-dev-aws-load-balancer-controller.yaml for
# how ArgoCD actually applies this - not installed onto a real cluster in
# this phase):
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     --version 3.5.0 -n kube-system \
#     -f networking/aws-load-balancer-controller/values-dev.yaml

# REQUIRED by the chart (a non-empty value is required) - must match
# terraform/environments/dev's cluster_name/environment
# ("${cluster_name}-${environment}", e.g. "taskflow-dev") exactly, since
# the controller uses this to discover ITS OWN cluster's tagged subnets
# and resources via the AWS API. See terraform/environments/dev/variables.tf.
clusterName: "taskflow-dev"

# region/vpcId deliberately left unset: on a real EKS worker node, the
# controller auto-detects both via the EC2 instance metadata service.
# Only needed if pods can't reach the metadata service for some reason.

serviceAccount:
  create: true
  # Fixed name (not chart-generated) because
  # terraform/modules/irsa's trust policy hardcodes this exact
  # ServiceAccount name/namespace pair - see
  # terraform/environments/dev/main.tf's
  # aws_load_balancer_controller_irsa module call.
  name: aws-load-balancer-controller
  annotations:
    # Set this to the irsa module's role_arn output
    # (terraform output aws_load_balancer_controller_role_arn) before
    # actually installing - left as a placeholder here, never a real
    # account ID. See docs/networking-architecture.md#aws-load-balancer-controller.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/taskflow-dev-aws-load-balancer-controller"

# Certs for the controller's own admission webhook are self-generated by
# a bootstrap Job (this chart's default) - no cert-manager dependency
# added just for this.
enableCertManager: false

replicaCount: 2

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 300m, memory: 256Mi }

# createIngressClassResource (this chart's own default: true) creates the
# "alb" IngressClass automatically - matching
# helm/taskflow/values.yaml's apiGateway.ingress.className: alb. Not
# overridden here; called out because helm/taskflow's Ingress depends on
# it existing.

# Lets kube-prometheus-stack's Prometheus scrape the controller's own
# reconciliation/AWS-API-call metrics - see
# docs/networking-architecture.md#ingress-observability for what this
# does and doesn't cover (this is the CONTROLLER's own health, not the
# ALB's health, which comes from AWS/CloudWatch instead). Namespace left
# unset -> defaults to this release's own namespace (kube-system).
# Prometheus still discovers it there regardless of namespace (see
# observability/prometheus/values-dev.yaml's
# serviceMonitorSelectorNilUsesHelmValues: false) - no need to relocate it
# into the monitoring namespace just to be found, which would otherwise
# require this chart's own AppProject to additionally whitelist a second
# destination namespace for one object.
serviceMonitor:
  enabled: true
