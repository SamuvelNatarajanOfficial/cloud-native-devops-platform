apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "postgres") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  # Deliberately hardcoded (not driven by a values field): PostgreSQL must
  # never be reachable from outside the cluster.
  type: ClusterIP
  selector:
    {{- include "taskflow.selectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      name: postgres
