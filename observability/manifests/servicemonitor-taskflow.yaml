# ServiceMonitor for TaskFlow's /metrics endpoints. Originally
# task-service only (Phase 5); Phase 6 broadened the selector to
# `app.kubernetes.io/part-of: taskflow` instead of naming task-service
# specifically, since api-gateway now exposes the same
# golden-signal-shaped /metrics endpoint on the same Service port name
# ("http") - see services/api-gateway/src/app.js and
# docs/observability-architecture.md#golden-signals. One ServiceMonitor
# now covers both Services; PostgreSQL's Service is unaffected (its port
# is named "postgres", not "http", so it never matches the endpoint below,
# and it has no /metrics endpoint to scrape regardless).
#
# Why a ServiceMonitor instead of a static Prometheus scrape_configs entry:
# a static config would need Prometheus's own config reloaded (a
# kube-prometheus-stack Helm upgrade) every time a target changes. A
# ServiceMonitor is Kubernetes-native service discovery instead - the
# Prometheus Operator watches for ServiceMonitor objects matching
# Prometheus's selector (see
# observability/prometheus/values-dev.yaml's
# serviceMonitorSelectorNilUsesHelmValues) and automatically (re)generates
# Prometheus's scrape config from whatever Kubernetes Services currently
# match `spec.selector` below - no IP address, pod name, or replica count
# is ever hardcoded.
#
# Why this lives here instead of inside helm/taskflow/: TaskFlow's chart
# (Phase 4) predates this phase and intentionally wasn't modified to avoid
# mixing an application-packaging change into an observability phase. A
# more mature version of this project would move this ServiceMonitor into
# helm/taskflow/templates/ so the app's own chart owns its own monitoring
# configuration - see observability/README.md#known-limitations.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskflow
  namespace: monitoring
  labels:
    app.kubernetes.io/name: taskflow
    app.kubernetes.io/part-of: taskflow
spec:
  # Both Services (helm/taskflow/templates/{api-gateway,task-service}-service.yaml)
  # live in the "taskflow" namespace, not "monitoring" where this
  # ServiceMonitor and Prometheus itself live - namespaceSelector is what
  # lets Prometheus look cross-namespace for the Services to discover.
  # By default Prometheus Operator sets the `job` label from the Service's
  # own metadata.name - which for this chart is "<release>-<component>"
  # (see helm/taskflow's taskflow.componentFullname helper), i.e. it would
  # change if the Helm release were ever renamed. Setting jobLabel instead
  # reads `job` from EACH matched Service's own app.kubernetes.io/name
  # label, so alert rules and dashboard queries reliably get
  # job="task-service" and job="api-gateway" (not a single hardcoded
  # value) regardless of release name.
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - taskflow
  selector:
    matchLabels:
      app.kubernetes.io/part-of: taskflow
  endpoints:
    - port: http # matches both Services' named port (see *-service.yaml) - postgres's port is named "postgres", so it never matches
      path: /metrics
      # 15s (this chart's own scrape-interval default) is frequent enough
      # to make the golden-signal dashboards responsive without generating
      # excessive sample volume for services this size - see
      # docs/observability-architecture.md#golden-signals.
      interval: 15s
      scrapeTimeout: 10s
