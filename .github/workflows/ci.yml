name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api-gateway:
    name: Test api-gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/api-gateway/package-lock.json
      - run: npm ci
      - run: npm test

  test-task-service:
    name: Test task-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/task-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/task-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  lint-dockerfiles:
    name: Lint Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/api-gateway/Dockerfile
          config: .hadolint.yaml
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/task-service/Dockerfile
          config: .hadolint.yaml

  secret-scan:
    name: Scan for committed secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This job only builds images locally (load: true) to scan them - it
  # never pushes anywhere (push: false), so there is no registry and
  # nothing here is ever deployed from. The Phase 4 GitOps flow this
  # repo documents (see docs/gitops-architecture.md) is: build -> push to
  # a real registry -> update helm/taskflow's image tag -> commit -> Git
  # ArgoCD change is applied automatically -> ArgoCD reconciles it onto
  # EKS - none of that is implemented here, since it needs a real
  # registry and would start writing GitOps commits from CI. Doing that
  # safely (e.g. GHCR + the built-in GITHUB_TOKEN, no long-lived
  # credentials) is a documented next step, not silently faked here.
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test-api-gateway, test-task-service, lint-dockerfiles]
    steps:
      - uses: actions/checkout@v4

      # Tagged with the commit SHA (in addition to the existing :ci tag,
      # kept for continuity) so this already uses the same immutable,
      # traceable tagging scheme a future push-to-registry step would
      # need - never "latest". See docs/technology-decisions.md ("Why
      # avoid latest image tags?").
      - name: Build api-gateway image
        uses: docker/build-push-action@v6
        with:
          context: services/api-gateway
          push: false
          tags: |
            taskflow/api-gateway:ci
            taskflow/api-gateway:${{ github.sha }}
          load: true

      - name: Build task-service image
        uses: docker/build-push-action@v6
        with:
          context: services/task-service
          push: false
          tags: |
            taskflow/task-service:ci
            taskflow/task-service:${{ github.sha }}
          load: true

      - name: Scan images for vulnerabilities (Trivy)
        # v0.28.0-v0.30.0 pin their internal setup-trivy dependency to a
        # tag (v0.2.1/v0.2.2) that's since been deleted upstream, which
        # breaks action resolution entirely. v0.31.0+ pins that nested
        # dependency by commit SHA instead, which can't go stale the same
        # way - use the latest stable release rather than another
        # tag-pinned older version.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow/task-service:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0" # report only in Phase 1; tighten to fail the build in a later phase
