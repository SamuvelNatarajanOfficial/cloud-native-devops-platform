---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: hardening_unattended_upgrades_enabled

- name: Enable automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: hardening_unattended_upgrades_enabled
  # unattended-upgrades' own /etc/apt/apt.conf.d/50unattended-upgrades
  # (installed by the package above) already restricts itself to the
  # distro's "-security" origin out of the box - it's intentionally left
  # untouched here rather than reimplementing/risking its Origins-Pattern
  # list by hand.

- name: Gather service facts
  ansible.builtin.service_facts:
  when: hardening_disable_unnecessary_services

- name: Disable unnecessary services not needed on a headless server
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ hardening_unnecessary_services }}"
  when:
    - hardening_disable_unnecessary_services
    - (item + '.service') in ansible_facts.services

# Guards every other SSH-related task below: a host without
# openssh-server installed (e.g. a minimal image, or a container-based
# test target) simply has nothing to harden here - failing outright in
# that case would be a surprising, unnecessary way for this otherwise
# always-on role to break.
- name: Check whether sshd_config exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: hardening_sshd_config_stat

- name: Ensure sshd_config has restrictive file permissions
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
  when: hardening_sshd_config_stat.stat.exists

- name: Deploy SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "{{ hardening_ssh_config_path }}"
    owner: root
    group: root
    mode: "0600"
    # Reject the new config outright if it doesn't parse, *before* it's
    # ever installed - this is what actually prevents a bad SSH config
    # from getting applied and locking you out. %s is replaced by a path
    # to a temporary copy of the rendered file.
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Reload SSH service
  when:
    - hardening_manage_ssh
    - hardening_sshd_config_stat.stat.exists
