apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskflow.componentFullname" (dict "root" . "component" "api-gateway") }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "taskflow.componentLabels" (dict "root" . "component" "api-gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "taskflow.selectorLabels" (dict "root" . "component" "api-gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskflow.componentLabels" (dict "root" . "component" "api-gateway") | nindent 8 }}
      {{- with .Values.apiGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.apiGateway.securityContext.pod | nindent 8 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.apiGateway.securityContext.container | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "taskflow.componentFullname" (dict "root" . "component" "api-gateway") }}
          # readiness = can this pod actually serve traffic right now
          # (reaches task-service); liveness = is the process itself
          # still alive. Both endpoints already exist in Phase 1 - see
          # services/api-gateway/src/app.js.
          livenessProbe:
            httpGet:
              path: {{ .Values.apiGateway.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.apiGateway.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.apiGateway.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.apiGateway.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.apiGateway.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.apiGateway.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.apiGateway.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.apiGateway.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.apiGateway.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          {{- if .Values.apiGateway.securityContext.container.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if .Values.apiGateway.securityContext.container.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
      {{- with .Values.apiGateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiGateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
